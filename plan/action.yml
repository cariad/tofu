name: OpenTofu plan
description: >-
  Plans an OpenTofu root module for a pull request, and writes the plan to the
  root module's comment on the PR. Its job needs `pull-requests: write`.

inputs:
  working-directory:
    description: >-
      The root module's directory, relative to the workspace, such as
      `infra/blog`. A leading `./` and any trailing `/` are removed, and it may
      contain only A-Z, a-z, 0-9, `.`, `_`, `/` and `-`. It can't start with
      `/` or have empty, `.` or `..` parts, except `.` itself, and it can't
      lead outside the workspace through a symlink.
    required: false
    default: .

outputs:
  changes:
    description: >-
      `true` if the plan has changes, or `false` if it has none. Empty if the
      plan failed. Set even if the step then fails to write the comment.
    value: ${{ steps.plan.outputs.changes }}

runs:
  using: composite
  steps:
    - name: Plan
      id: plan
      shell: bash
      env:
        # Not GH_TOKEN, which tofu and its providers would see.
        #
        # `plan.sh` keeps it from them and gives it only to gh.
        CARIAD_TOFU_GITHUB_TOKEN: ${{ github.token }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      # `exec`, so the runner's signals reach plan.sh and it deletes the plan
      # when the job is cancelled or times out.
      run: exec bash "$GITHUB_ACTION_PATH/../scripts/plan.sh"
