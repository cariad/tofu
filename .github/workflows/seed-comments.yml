name: seed-comments

on:
  pull_request:
    types:
      - labeled

permissions: {}

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:
      - name: Post the bot's seed comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          comment() {
            gh api "repos/$REPO/issues/$PR/comments" -f body="$1" --silent
          }
          marker() {
            printf '<!-- cariad/tofu {"v":1,"dir":"%s","status":"planned","sha":"%s"} -->' \
              "$1" 0000000000000000000000000000000000000000
          }
          comment "$(marker infra/other)"$'\n'"Seed 3: the bot's comment for infra/other."
          comment "$(marker infra/blog)"$'\n'"Seed 4: the bot's first comment for infra/blog."
          comment "Seed 5: the bot's comment with no marker."
          comment "Seed 6: the bot's comment with its marker on line 2."$'\n'"$(marker infra/second-line)"
          comment "$(marker infra/blog)"$'\n'"Seed 7: the bot's second comment for infra/blog."
          comment "$(marker infra/blog-old)"$'\n'"Seed 8: the bot's comment for infra/blog-old."
          comment '<!-- cariad/tofu not json -->'$'\n'"Seed 9: the bot's comment whose marker isn't JSON."
