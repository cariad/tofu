name: capture-race

on:
  pull_request:
    types:
      - labeled

permissions: {}

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      pull-requests: write  # Create, list, update and delete the PR's comments

    steps:
      - name: Race to create infra/new's comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir "$RUNNER_TEMP/responses"
          cd "$RUNNER_TEMP/responses"

          # The marker the plan action writes for infra/new at the PR's head.
          marker='<!-- cariad/tofu {"v":1,"dir":"infra/new","status":"planned","sha":"'"$SHA"'"} -->'
          first="$marker"$'\n'"The first run's comment for infra/new."
          second="$marker"$'\n'"The second run's comment for infra/new."

          gh api "repos/$REPO/pulls/$PR" >pull.json

          # Neither run finds a comment, so each creates one.
          gh api "repos/$REPO/issues/$PR/comments" -f body="$first" >created-1.json
          gh api "repos/$REPO/issues/$PR/comments" -f body="$second" >created-2.json

          # The second run lists the comments, finds the first run's is older,
          # deletes its own and updates the first run's instead.
          gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" >race-comments.json
          gh api --method DELETE "repos/$REPO/issues/comments/$(jq .id created-2.json)" --silent
          gh api --method PATCH "repos/$REPO/issues/comments/$(jq .id created-1.json)" -f body="$second" >updated.json

      - name: Upload the responses
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: responses
          path: ${{ runner.temp }}/responses
          retention-days: 1
