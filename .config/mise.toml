# Keep `min_version` in sync with:
#
# - `.github/workflows/ci.yml`•`jdx/mise-action`•`version`
# - mise's schema URL in `.config/tombi.toml`.
min_version = "2026.10.2"

[settings]
minimum_release_age = "7d"

[tasks.lint]
description = "Run all linters"
depends = ["lint:*"]

[tasks."lint:editorconfig"]
description = "Lint files against .editorconfig"
run = "editorconfig-checker"

[tasks."lint:markdown"]
description = "Lint Markdown files"
run = "rumdl check --deny-config-warnings"

[tasks."lint:shell"]
description = "Lint shell scripts"
# Lint every `*.sh` file that Git knows about.
# `-r` stops GNU xargs running ShellCheck with no files, which fails.
run = "git ls-files -z --cached --others --exclude-standard -- '*.sh' | xargs -0 -r shellcheck"

[tasks."lint:toml"]
description = "Lint TOML files"
run = [
  "tombi lint --error-on-warnings .",
  "tombi format --check --diff .",
]

[tasks."lint:web"]
description = "Lint web files"
# Biome skips files that aren't valid UTF-8 without failing them, so we run
# `lint:editorconfig` first and hope its `charset` check catches most of them.
depends = ["lint:editorconfig"]
run = "biome check --error-on-warnings"

[tasks."lint:zizmor"]
description = "Audit GitHub Actions files"
# Needs GH_TOKEN for online audits.
# Keep zizmor's arguments in sync with `lint:zizmor:ci`.
env = { GH_TOKEN = "{{ exec(command='gh auth token') }}" }
run = "zizmor --strict-collection ."

[tasks."lint:zizmor:ci"]
description = "Audit GitHub Actions files in CI"
# CI passes a token in `GH_TOKEN` for zizmor's online audits.
# Keep zizmor's arguments in sync with `lint:zizmor`.
run = "zizmor --strict-collection ."

[tools]
biome = "2.5.14"                # Lint web files
editorconfig-checker = "4.0.2"  # Lint files against .editorconfig
gh = "2.102.0"                  # Get a GitHub token for zizmor
# Keep in sync with schema URL in `.config/tombi.toml`:
rumdl = "0.2.77"                # Lint Markdown files
# ShellCheck publishes no attestations or signatures, so its lock entries hold
# only the checksums that GitHub reports at lock-time.
shellcheck = "0.11.0"           # Lint shell scripts
tombi = "1.5.5"                 # Lint TOML files
zizmor = "1.30.1"               # Audit GitHub Actions files
